<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <!-- Fondo opcional -->
  <rect width="400" height="120" fill="none"/>
  
  <!-- Letra 'm' - Verde Oscuro -->
  <text x="10" y="95" font-family="Arial, sans-serif" font-size="90" font-weight="bold" fill="#1B5E4F" letter-spacing="-5">m</text>
  
  <!-- Barra vertical naranja -->
  <rect x="115" y="15" width="18" height="85" fill="#FF9D3C" rx="3"/>
  
  <!-- Letras 'immo' - Verde Oscuro -->
  <text x="145" y="95" font-family="Arial, sans-serif" font-size="90" font-weight="bold" fill="#1B5E4F" letter-spacing="-8">immo</text>
  
  <!-- Símbolo de documento/factura debajo (opcional) -->
  <g transform="translate(380, 30)">
    <rect x="0" y="0" width="15" height="20" fill="none" stroke="#FF9D3C" stroke-width="1.5" rx="1"/>
    <line x1="3" y1="6" x2="12" y2="6" stroke="#FF9D3C" stroke-width="1"/>
    <line x1="3" y1="10" x2="12" y2="10" stroke="#FF9D3C" stroke-width="1"/>
    <line x1="3" y1="14" x2="12" y2="14" stroke="#FF9D3C" stroke-width="1"/>
  </g>
</svg>
